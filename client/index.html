<!doctype html>
<html lang="en">

  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>Stock Predictor - AI Trading Signals</title>
    <meta name="description" content="Real-time stock analysis with ML-powered buy/sell signals for Trading 212" />
    <meta name="theme-color" content="#000000" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Stock Predictor" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text x='50' y='50' font-size='80' text-anchor='middle' dominant-baseline='central'>📈</text></svg>" />    

  </head>

  <body>
    <div id="root"></div>
    <script>
      // Suppress Vite WebSocket connection errors from debug collector
      const originalError = console.error;
      console.error = function(...args) {
        const errorStr = String(args[0] || '');
        if (errorStr.includes('[vite]') && errorStr.includes('failed to connect to websocket')) {
          return; // Silently ignore this specific error
        }
        originalError.apply(console, args);
      };
      
      // Also prevent the error from being reported via window.onerror
      window.addEventListener('error', (event) => {
        if (event.message && event.message.includes('[vite]') && event.message.includes('websocket')) {
          event.preventDefault();
        }
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
    <script
      defer
      src="%VITE_ANALYTICS_ENDPOINT%/umami"
      data-website-id="%VITE_ANALYTICS_WEBSITE_ID%"></script>
  </body>

</html>
